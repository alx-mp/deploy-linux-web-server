<?xml version="1.0" encoding="UTF-8"?>
<svg fill="none" viewBox="0 0 490 150" width="490" height="150" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes neonPulse {
          0% {
            box-shadow: 0 0 5px #03e9f4,
                        0 0 25px #03e9f4,
                        0 0 50px #03e9f4,
                        0 0 200px #03e9f4;
            text-shadow: 0 0 5px #03e9f4,
                        0 0 25px #03e9f4,
                        0 0 50px #03e9f4;
          }
          50% {
            box-shadow: 0 0 10px #03e9f4,
                        0 0 35px #03e9f4,
                        0 0 75px #03e9f4,
                        0 0 250px #03e9f4;
            text-shadow: 0 0 10px #03e9f4,
                        0 0 35px #03e9f4,
                        0 0 75px #03e9f4;
          }
          100% {
            box-shadow: 0 0 5px #03e9f4,
                        0 0 25px #03e9f4,
                        0 0 50px #03e9f4,
                        0 0 200px #03e9f4;
            text-shadow: 0 0 5px #03e9f4,
                        0 0 25px #03e9f4,
                        0 0 50px #03e9f4;
          }
        }

        @keyframes float {
          0% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
          100% { transform: translateY(0); }
        }

        .container {
          width: 100%;
          height: 150px;
          display: flex;
          justify-content: center;
          align-items: center;
          background: #0d1117;
        }

        .button {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 35px 40px;
          background: rgba(3, 233, 244, 0.05);
          color: #03e9f4;
          text-transform: uppercase;
          font-family: 'Raleway', sans-serif;
          font-weight: bold;
          letter-spacing: 4px;
          gap: 20px;
          animation: neonPulse 2s infinite;
          transition: 0.5s;
          position: relative;
          overflow: hidden;
        }

        .button::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(
            90deg,
            transparent,
            rgba(3, 233, 244, 0.2),
            transparent
          );
          transition: 0.5s;
          animation: shine 3s infinite;
        }

        @keyframes shine {
          0% { left: -100%; }
          50% { left: 100%; }
          100% { left: 100%; }
        }

        .burger-icon {
          font-size: 40px;
          animation: float 2s ease-in-out infinite;
          filter: drop-shadow(0 0 5px #03e9f4)
                 drop-shadow(0 0 15px #03e9f4)
                 drop-shadow(0 0 25px #03e9f4);
        }

        .button-text {
          padding-left: 15px;
          position: relative;
          z-index: 1;
          font-size: 20px;
        }

        @media (prefers-reduced-motion) {
          .button, .burger-icon, .button::before {
            animation: none;
          }
        }
      </style>

      <div class="container">
        <div class="button">
          <span class="burger-icon">🍔</span>
          <span class="button-text">Dar Hamburguesa!</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>